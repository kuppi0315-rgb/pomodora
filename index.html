<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>POMODORA</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =====================
   右ナビ（機能）
===================== -->

<div id="side-icons">

  <a href="pages/guild.html">
    <img class="icon-img" src="assets/icons/guild.png">
  </a>

  <a href="pages/ranking.html">
    <img class="icon-img" src="assets/icons/trophy.png">
  </a>

</div>

<!-- =====================
   ロビー本体
===================== -->

<div id="lobby">

  <!-- タイトル -->
  <h1 id="logo">POMODORA</h1>

  <!-- モンスター（中央主役） -->
  <div id="monster-area">

    <img id="monster" src="assets/monsters/monster1.png">

    <h2 id="level">Lv.1</h2>

    <!-- EXP -->
    <div id="exp-bar">
      <div id="exp-fill"></div>
    </div>

    <p>
      EXP <span id="exp">0</span> / <span id="need">100</span>
    </p>

  </div>

  <!-- ステータス -->
  <div id="status">
    今日 <span id="today">0</span> / 累計 <span id="total">0</span>
  </div>

  <!-- アクション（下部） -->
  <div id="action">

    <img id="hourglass-btn" src="assets/icons/hourglass.png">

    <p>タップして集中開始</p>

  </div>

</div>

<!-- =====================
   タイマー
===================== -->

<div id="timer-screen" class="hidden">

  <h1>集中モード</h1>
  <div id="timer">00:10</div>
  <button id="stop">中断</button>

</div>

<audio id="bgm" src="assets/sounds/timer.mp3" loop></audio>
<audio id="finish" src="assets/sounds/finish.mp3"></audio>

<script src="script.js"></script>

</body>

</html>
