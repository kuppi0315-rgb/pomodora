<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POMODORA</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ホーム -->
  <div id="home">

    <h1 id="logo">POMODORA</h1>

    <img id="monster" src="assets/monsters/monster1.png">

    <p>今日 <span id="today">0</span> / 累計 <span id="total">0</span></p>

    <!-- 砂時計 -->
    <div id="hourglass-btn">

      <div class="hourglass">

        <div class="glass top">
          <div class="sand sand-top"></div>
        </div>

        <div class="middle"></div>

        <div class="glass bottom">
          <div class="sand sand-bottom"></div>
        </div>

      </div>

    </div>

  </div>

  <!-- タイマー -->
  <div id="timer-screen" class="hidden">

    <div id="focus-overlay"></div>

    <h1>集中中</h1>
    <div id="timer">00:10</div>

    <button id="stop">中断</button>

  </div>

  <audio id="bgm" src="assets/sounds/timer.mp3" loop></audio>
  <audio id="finish" src="assets/sounds/finish.mp3"></audio>

  <script src="script.js"></script>

</body>

</html>
