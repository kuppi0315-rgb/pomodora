<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>POMODORA</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- ローディング -->

  <div id="loading">

    <h1>POMODORA</h1>

    <p>Loading...</p>

  </div>

  <!-- モンスター選択 -->

  <div id="select-screen" class="hidden">

    <h2>モンスターを選択</h2>

    <div class="monster-list">

      <img
        src="assets/monsters/monster1.png"
        class="monster-select"
        data-monster="monster1"
      >

      <img
        src="assets/monsters/monster2.png"
        class="monster-select"
        data-monster="monster2"
      >

      <img
        src="assets/monsters/monster3.png"
        class="monster-select"
        data-monster="monster3"
      >

    </div>

  </div>

  <!-- ホーム -->

  <div id="home" class="hidden">

    <h1>POMODORA</h1>

    <!-- 広場 -->

    <div id="plaza">

      <img
        id="monster-image"
        src="assets/monsters/sleep.png"
      >

    </div>

    <h2 id="monster-level">
      Lv.1
    </h2>

    <div id="exp-container">

      <div id="exp-bar"></div>

    </div>

    <p>
      EXP :
      <span id="exp">0</span>
    </p>

    <p>
      今日 :
      <span id="today-count">0</span>
    </p>

    <p>
      累計 :
      <span id="total-count">0</span>
    </p>

    <!-- タイマー -->

    <div id="timer">
      25:00
    </div>

    <div class="buttons">

      <button id="start-btn">
        START
      </button>

      <button id="stop-btn">
        STOP
      </button>

      <button id="reset-btn">
        RESET
      </button>

    </div>

  </div>

  <!-- 完了音 -->

  <audio
    id="finish-sound"
    src="assets/sounds/finish.mp3"
  ></audio>

  <script src="script.js"></script>

</body>

</html>
