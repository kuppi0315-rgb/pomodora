<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>POMODORA</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ローディング -->

  <div id="loading">

    <h1>POMODORA</h1>

    <p>Loading...</p>

  </div>

  <!-- ドラゴン選択 -->

  <div id="select-screen" class="hidden">

    <h2>ドラゴンを選択</h2>

    <div class="dragon-list">

      <img src="assets/dragons/dragon1.png"
      class="dragon-select"
      data-dragon="dragon1">

      <img src="assets/dragons/dragon2.png"
      class="dragon-select"
      data-dragon="dragon2">

      <img src="assets/dragons/dragon3.png"
      class="dragon-select"
      data-dragon="dragon3">

    </div>

  </div>

  <!-- ホーム -->

  <div id="home" class="hidden">

    <h1>POMODORA</h1>

    <img id="dragon-image"
    src="assets/dragons/sleep.png">

    <h2 id="dragon-level">
      Lv.1
    </h2>

    <p>
      EXP :
      <span id="exp">
        0
      </span>
    </p>

    <p>
      ポモドーロ :
      <span id="pomodoro-count">
        0
      </span>
    </p>

    <div id="timer">
      25:00
    </div>

    <button id="start-btn">
      START
    </button>

    <button id="stop-btn">
      STOP
    </button>

    <button id="reset-btn">
      RESET
    </button>

  </div>

  <script src="script.js"></script>

</body>

</html>
