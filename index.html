<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POMODORA</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ローディング -->
  <div id="loading">
    <h1>POMODORA</h1>
    <p>Loading...</p>
  </div>

  <!-- 選択 -->
  <div id="select-screen" class="hidden">

    <h2>モンスターを選択</h2>

    <div class="monster-list">

      <img src="assets/monsters/monster1.png" class="monster-select" data-monster="monster1">
      <img src="assets/monsters/monster2.png" class="monster-select" data-monster="monster2">
      <img src="assets/monsters/monster3.png" class="monster-select" data-monster="monster3">

    </div>

  </div>

  <!-- ホーム -->
  <div id="home" class="hidden">

    <h1>POMODORA</h1>

    <div id="plaza">

      <img id="monster-image" src="assets/monsters/sleep.png">

      <div id="plaza-ground"></div>

    </div>

    <h2 id="monster-level">Lv.1</h2>

    <p>EXP : <span id="exp">0</span></p>
    <p>今日 : <span id="today-count">0</span></p>
    <p>累計 : <span id="total-count">0</span></p>

    <!-- ★砂時計（超大型化） -->
    <div id="hourglass-btn">⏳ START</div>

  </div>

  <!-- タイマー -->
  <div id="timer-screen" class="hidden">

    <h1>集中中...</h1>

    <div id="timer">00:01</div>

    <button id="stop-btn">中断</button>

  </div>

  <!-- 音 -->
  <audio id="finish-sound" src="assets/sounds/finish.mp3"></audio>

  <script src="script.js"></script>

</body>

</html>
