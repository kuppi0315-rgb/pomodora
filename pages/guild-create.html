<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Guild Create</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<div id="guild-screen">

  <h1>ギルド作成</h1>

  <div class="guild-card">

    <input id="guild-name" placeholder="ギルド名">

    <select id="guild-type">
      <option value="public">パブリック（誰でも参加可）</option>
      <option value="private">プライベート（ID制）</option>
    </select>

    <button class="guild-btn" onclick="createGuild()">
      ギルドを作成
    </button>

    <p id="result"></p>

  </div>

</div>

<script>
function randomId(){
  let id="";
  for(let i=0;i<8;i++) id+=Math.floor(Math.random()*10);
  return id;
}

function createGuild(){
  const g={
    id:randomId(),
    name:document.getElementById("guild-name").value,
    type:document.getElementById("guild-type").value,
    members:[],
    total:0
  };

  localStorage.setItem("guild",JSON.stringify(g));

  document.getElementById("result").innerText =
    "作成完了 ID: " + g.id;
}
</script>

</body>

</html>
